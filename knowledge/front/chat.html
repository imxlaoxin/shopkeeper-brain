<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>智能知识问答助手</title>
  <style>
    /* 全新明亮极简风格变量 */
    :root{
      --bg:#f3f4f6; /* 浅灰背景 */
      --panel:#ffffff; /* 纯白面板 */
      --text:#1f2937; /* 深灰文字 */
      --muted:#6b7280; /* 弱化文字 */
      --brand:#059669; /* 企业绿 */
      --brand-hover:#047857;
      --bubble-user:#059669; /* 用户气泡为绿色 */
      --bubble-bot:#f9fafb; /* 机器人气泡为浅灰色 */
      --border:#e5e7eb;
      --shadow:0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg);
      color:var(--text);
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      padding:20px;
    }
    /* 面板重构为简洁卡片 */
    .app{
      width:100%;
      max-width:1000px;
      height:min(850px, 95vh);
      background:var(--panel);
      border:1px solid var(--border);
      border-radius:12px;
      box-shadow:var(--shadow);
      display:flex;
      flex-direction:column;
      overflow:hidden;
    }
    .topbar{
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:16px 24px;
      border-bottom:1px solid var(--border);
      background:#ffffff;
    }
    .brand{
      display:flex;
      align-items:center;
      gap:12px;
    }
    .logo{
      width:32px;height:32px;border-radius:8px;
      background:var(--brand);
      display:flex;
      align-items:center;
      justify-content:center;
    }
    .logo::after {
      content: 'AI';
      color: white;
      font-weight: bold;
      font-size: 14px;
    }
    .title{
      display:flex;
      flex-direction:column;
    }
    .title strong{font-size:16px; font-weight:600;}
    .title span{font-size:12px;color:var(--muted);margin-top:2px}
    .top-actions{
      display:flex;
      gap:16px;
      align-items:center;
    }
    .btn{
      border:1px solid var(--border);
      background:#ffffff;
      color:var(--text);
      padding:8px 16px;
      border-radius:6px;
      font-size:13px;
      font-weight:500;
      cursor:pointer;
      transition:all 0.2s;
    }
    .btn:hover{background:#f9fafb; border-color:#d1d5db;}
    .btn:disabled{opacity:.5;cursor:not-allowed}

    .chat{
      flex:1;
      overflow:auto;
      padding:24px;
      background:#ffffff;
    }
    .dayline{
      text-align:center;
      color:var(--muted);
      font-size:12px;
      margin:10px 0 20px;
      position:relative;
    }
    .dayline::before, .dayline::after {
      content: '';
      position: absolute;
      top: 50%;
      width: 40%;
      height: 1px;
      background: var(--border);
    }
    .dayline::before { left: 0; }
    .dayline::after { right: 0; }

    .msg{
      display:flex;
      gap:12px;
      margin:20px 0;
      align-items:flex-start;
    }
    .msg.user{justify-content:flex-end}
    .msg > div:not(.avatar){
      flex:1;
      min-width:0;
    }
    .msg.user > div:not(.avatar){
      display:flex;
      flex-direction:column;
      align-items:flex-end;
    }
    /* 头像重构为圆形 */
    .avatar{
      width:36px;height:36px;border-radius:50%;
      background:#e5e7eb;
      display:flex;align-items:center;justify-content:center;
      font-size:13px;
      font-weight:600;
      color:#4b5563;
      flex:0 0 auto;
    }
    .avatar.bot{background:var(--brand); color:#ffffff;}

    /* 气泡去边框，采用极简色块 */
    .bubble{
      max-width:min(700px, 85%);
      display:inline-block;
      border-radius:8px;
      padding:12px 16px;
      background:var(--bubble-bot);
      line-height:1.6;
      font-size:14px;
      white-space:pre-wrap;
      overflow-wrap: break-word;
      color:var(--text);
      border: 1px solid var(--border);
    }
    .msg.user .bubble{
      background:var(--bubble-user);
      color:#fff;
      border:none;
      border-bottom-right-radius: 2px;
    }
    .msg:not(.user) .bubble {
      border-top-left-radius: 2px;
    }
    .meta{
      font-size:12px;
      color:var(--muted);
      margin-top:8px;
    }
    .msg.user .meta{color:var(--muted)}

    /* 折叠进度条重构为扁平化卡片 */
    details.progress{
      margin-top:12px;
      border:1px solid #f3f4f6;
      border-left: 3px solid var(--brand);
      border-radius:6px;
      padding:10px 14px;
      background:#ffffff;
      box-shadow: 0 1px 2px rgba(0,0,0,0.02);
      /* 修复：强制防御继承的 pre-wrap 以及浮动导致的高度塌陷 */
      white-space: normal;
      display: block;
      clear: both;
    }
    details.progress summary{
      cursor:pointer;
      user-select:none;
      color:var(--text);
      font-size:13px;
      font-weight: 500;
    }
    .progress ul{margin:10px 0 0 20px;padding:0}
    .progress li{margin:6px 0;font-size:13px;color:#4b5563}

    .answer-images{ margin-top:12px; display:flex; flex-direction:column; gap:12px; }
    .answer-images img{
      display: block; max-width: min(100%, 500px); border-radius:8px;
      border:1px solid var(--border);
    }
    .answer-images a{ font-size:12px; color:var(--brand); text-decoration:none; }

    /* 输入点动画调整为品牌色 */
    .typing{ display:inline-flex;gap:4px;align-items:center; height: 20px;}
    .dot{
      width:6px;height:6px;border-radius:50%;
      background:var(--brand);
      animation:bounce 1.4s infinite ease-in-out both;
    }
    .dot:nth-child(1){animation-delay:-0.32s}
    .dot:nth-child(2){animation-delay:-0.16s}
    @keyframes bounce{
      0%,80%,100%{transform:scale(0)}
      40%{transform:scale(1)}
    }

    .composer{
      border-top:1px solid var(--border);
      padding:16px 24px;
      display:flex;
      flex-direction:column;
      background:#ffffff;
    }
    .composer-inner {
      display:flex;
      gap:12px;
      align-items:flex-end;
    }
    textarea{
      flex:1;
      resize:none;
      min-height:50px;
      max-height:150px;
      padding:12px 16px;
      border-radius:8px;
      border:1px solid var(--border);
      outline:none;
      font-size:14px;
      line-height:1.5;
      background:#f9fafb;
      color:var(--text);
      transition: border-color 0.2s;
    }
    textarea:focus{border-color:var(--brand); background:#ffffff;}
    textarea::placeholder{color:#9ca3af}
    .send{
      width:90px;
      height:50px;
      border:none;
      border-radius:8px;
      cursor:pointer;
      font-size:14px;
      font-weight: 500;
      color:#fff;
      background:var(--brand);
      transition: background 0.2s;
    }
    .send:hover{background:var(--brand-hover);}
    .send:disabled{opacity:.6;cursor:not-allowed}
    .hint{
      display: flex;
      justify-content: space-between;
      margin-top: 12px;
      color:var(--muted);
      font-size:12px;
    }
    .kbd{
      font-family: inherit;
      border:1px solid var(--border);
      padding:2px 6px;
      border-radius:4px;
      background:#f3f4f6;
      color:#4b5563;
      font-size:11px;
    }

    /* --- 修复升级后的澄清选项卡样式 --- */
    .options-wrapper {
      margin-top: 14px;
      padding: 14px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      /* 修复点：强制设为 block 布局，杜绝 flex column 高度计算 Bug */
      display: block;
      white-space: normal;
      clear: both;
    }
    .options-title {
      font-size: 13px;
      color: #4b5563;
      font-weight: 500;
      margin-bottom: 12px;
    }
    .tags-container {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 14px;
    }
    .suggest-tag {
      border: 1px solid #d1d5db;
      background: #ffffff;
      color: #4b5563;
      padding: 6px 14px;
      border-radius: 16px;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s ease;
      user-select: none;
    }
    .suggest-tag:hover {
      border-color: var(--brand);
      color: var(--brand);
    }
    /* 选中态：品牌绿高亮 */
    .suggest-tag.selected {
      background: #ecfdf5;
      border-color: var(--brand);
      color: var(--brand);
      font-weight: 500;
      box-shadow: 0 0 0 2px rgba(5, 150, 105, 0.15);
    }
    .options-actions {
      display: flex;
      gap: 8px;
      padding-top: 12px;
      border-top: 1px dashed #e5e7eb;
    }
    .action-pill {
      border: none;
      background: var(--brand);
      color: #fff;
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s;
    }
    .action-pill:hover {
      background: var(--brand-hover);
    }
    .action-pill.secondary {
      background: #e5e7eb;
      color: #374151;
    }
    .action-pill.secondary:hover {
      background: #d1d5db;
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="topbar">
      <div class="brand">
        <div class="logo"></div>
        <div class="title">
          <strong>企业知识库</strong>
          <span id="subTitle">Workspace Knowledge Engine</span>
        </div>
      </div>
      <div class="top-actions">
        <label style="font-size:13px;display:flex;align-items:center;gap:6px;cursor:pointer;user-select:none;color:var(--text);">
          <input type="checkbox" id="streamToggle" checked> 流式输出模式
        </label>
        <button class="btn" id="btnClear">清空会话</button>
      </div>
    </div>

    <div class="chat" id="chat">
      <div class="dayline">今日会话</div>
      <div class="msg bot">
        <div class="avatar bot">AI</div>
        <div>
          <div class="bubble">您好，我是企业知识库助手。请输入您想查询的内容，我将从已构建的知识库中为您提取信息。</div>
          <div class="meta">系统提示：支持自然语言检索与复杂图文分析。</div>
        </div>
      </div>
    </div>

    <div class="composer">
      <div class="composer-inner">
        <textarea id="input" placeholder="输入您的问题... (Enter 发送，Shift+Enter 换行)"></textarea>
        <button class="send" id="send">发送</button>
      </div>
      <div class="hint">
        <span>请放心提问。</span>
        <span><span class="kbd">Enter</span> 发送 / <span class="kbd">Shift</span>+<span class="kbd">Enter</span> 换行</span>
      </div>
    </div>
  </div>

  <script>
    const API_BASE = `${location.protocol}//${location.host}`.includes('http') ? `${location.protocol}//${location.host}` : 'http://127.0.0.1:8001';
    const chatEl = document.getElementById('chat');
    const inputEl = document.getElementById('input');
    const sendBtn = document.getElementById('send');
    const btnClear = document.getElementById('btnClear');
    const streamToggle = document.getElementById('streamToggle');

    let sessionId = localStorage.getItem('kb_session_id');
    if (!sessionId) {
      sessionId = 'sess-' + Math.random().toString(36).slice(2) + Date.now().toString(36);
      localStorage.setItem('kb_session_id', sessionId);
    }

    // === 升级版：防止重复渲染 + 正确的文档流拼接 ===
    function renderClarifyOptions(bubbleEl, options) {
      if (!options || !Array.isArray(options) || options.length === 0) return;

      // 【关键修复 1】：防重叠与重复渲染。若当前气泡中已经存在选项卡，直接退出。
      if (bubbleEl.querySelector('.options-wrapper')) {
        return;
      }

      const optionsWrap = document.createElement('div');
      optionsWrap.className = 'options-wrapper';

      const titleEl = document.createElement('div');
      titleEl.className = 'options-title';
      titleEl.textContent = '💡 检测到多个相似产品，您可以点击选择（支持多选）：';
      optionsWrap.appendChild(titleEl);

      const tagsContainer = document.createElement('div');
      tagsContainer.className = 'tags-container';

      // 记录当前被选中的选项
      const selectedSet = new Set();

      options.forEach(opt => {
        const tag = document.createElement('div');
        tag.className = 'suggest-tag';
        tag.textContent = opt;

        // 点击切换选中态
        tag.onclick = () => {
          if (selectedSet.has(opt)) {
            selectedSet.delete(opt);
            tag.classList.remove('selected');
          } else {
            selectedSet.add(opt);
            tag.classList.add('selected');
          }
        };
        tagsContainer.appendChild(tag);
      });
      optionsWrap.appendChild(tagsContainer);

      // 底部快捷操作栏
      const actionsEl = document.createElement('div');
      actionsEl.className = 'options-actions';

      // 按钮 1：把选中的型号填入输入框
      const fillBtn = document.createElement('button');
      fillBtn.className = 'action-pill secondary';
      fillBtn.textContent = '将选中型号填入输入框';
      fillBtn.onclick = () => {
        const selectedArr = Array.from(selectedSet);
        if (selectedArr.length === 0) {
          alert('请先点击上方标签选择至少一个型号');
          return;
        }
        // 追加填入输入框但不发送，让用户可以自己补充问题
        const currentVal = inputEl.value.trim();
        const joinText = selectedArr.join('、');
        inputEl.value = currentVal ? `${currentVal} ${joinText}` : joinText;
        inputEl.focus();
      };
      actionsEl.appendChild(fillBtn);

      // 按钮 2：如果选了多个，一键发起对比提问
      const compareBtn = document.createElement('button');
      compareBtn.className = 'action-pill';
      compareBtn.textContent = '一键对比所选型号差异';
      compareBtn.onclick = () => {
        const selectedArr = Array.from(selectedSet);
        if (selectedArr.length < 2) {
          alert('请至少选择 2 个型号进行对比');
          return;
        }
        // 自动组装对比意图并直接发送
        const promptText = `请帮我详细对比 ${selectedArr.join(' 和 ')} 之间有什么区别？`;
        inputEl.value = promptText;

        // 禁用该卡片所有标签和按钮，防止重复操作
        optionsWrap.querySelectorAll('.suggest-tag, .action-pill').forEach(el => el.style.pointerEvents = 'none');
        optionsWrap.style.opacity = '0.7';

        onSend();
      };
      actionsEl.appendChild(compareBtn);

      optionsWrap.appendChild(actionsEl);

      // 【关键修复 2】：统一改为追加到父容器的最底部，
      // 这保证了它顺理成章地出现在“阶段进度条”下方，从而彻底解决被覆盖/重叠的问题！
      bubbleEl.appendChild(optionsWrap);
    }

    function scrollToBottom(){
      chatEl.scrollTop = chatEl.scrollHeight;
    }
    function nowTime(){
      const d = new Date();
      return d.toLocaleTimeString('zh-CN', {hour:'2-digit', minute:'2-digit'});
    }
    function formatTime(ts){
      if(!ts) return nowTime();
      const d = new Date(Number(ts) * 1000);
      if(Number.isNaN(d.getTime())) return nowTime();
      return d.toLocaleTimeString('zh-CN', {hour:'2-digit', minute:'2-digit'});
    }
    function escapeHtml(str){
      return String(str)
        .replaceAll('&','&amp;')
        .replaceAll('<','&lt;')
        .replaceAll('>','&gt;')
        .replaceAll('"','&quot;')
        .replaceAll("'","&#039;");
    }

    function isImageUrl(url){
      try {
        const u = new URL(url);
        return /\.(png|jpe?g|gif|webp|bmp|svg)$/i.test(u.pathname);
      } catch (e) {
        return /\.(png|jpe?g|gif|webp|bmp|svg)(\?|#|$)/i.test(url || '');
      }
    }

    function normalizeUrl(rawUrl){
      const s = String(rawUrl || '').trim();
      if(!s) return '';
      return s.replace(/\s/g, '%20');
    }

    function dedupeKeepOrder(arr){
      const seen = new Set();
      const out = [];
      for(const x of (Array.isArray(arr) ? arr : [])){
        const v = String(x || '');
        if(!v) continue;
        if(seen.has(v)) continue;
        seen.add(v);
        out.push(v);
      }
      return out;
    }

    function extractUrlsLoose(text){
      const s = String(text || '');
      const regex = /(https?:\/\/[^\s]+)/g;
      const matches = s.match(regex) || [];
      const urls = [];
      const trimTailPunct = (u) => String(u || '').replace(/[)\]}'">，。,;；\]】）＞]+$/g, '');
      const trimHeadPunct = (u) => String(u || '').replace(/^[<([{'"]+|^[＜（【\[]+/g, '');
      for(const m of matches){
        let u = trimHeadPunct(trimTailPunct(m));
        if(u) urls.push(u);
      }
      return dedupeKeepOrder(urls);
    }

    function parseImagesFromTextLoosely(text){
      const urls = extractUrlsLoose(text).filter(isImageUrl);
      return dedupeKeepOrder(urls);
    }

    function findLastImageMarkerIndex(raw){
      const s = String(raw || '');
      const re = /【\s*图片\s*】|\[\s*图片\s*\]/g;
      let m;
      let lastIdx = -1;
      let lastLen = 0;
      while((m = re.exec(s)) !== null){
        lastIdx = m.index;
        lastLen = m[0].length;
      }
      return { idx: lastIdx, len: lastLen };
    }

    function parseAnswerAndImages(text){
      const raw = String(text || '');
      const { idx, len } = findLastImageMarkerIndex(raw);
      if(idx === -1) return { text: raw, images: [] };

      const before = raw.slice(0, idx).trimEnd();
      const after = raw.slice(idx + len).trim();
      const urls = [];

      const lines = after.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
      for(const line of lines){
        if(line.startsWith('http://') || line.startsWith('https://')){
          urls.push(line);
        }else{
          const matches = extractUrlsLoose(line);
          for(const u of matches){
            urls.push(u);
          }
        }
      }

      const seen = new Set();
      const images = [];
      for(const u of urls){
        const normalized = normalizeUrl(u);
        if(!isImageUrl(normalized)) continue;
        if(seen.has(normalized)) continue;
        seen.add(normalized);
        images.push(normalized);
      }
      return { text: before, images };
    }

    function shouldShowImagesByAnswer(answerText){
      const t = String(answerText || '');
      const keywords = [
        '如图', '如下图', '见图', '见下图', '下图', '上图',
        '图片', '示意图', '结构图', '外观', '接线图', '电路图', '原理图', '安装图', '尺寸图', '截图'
      ];
      return keywords.some(k => t.includes(k));
    }

    function renderAnswerWithImages(containerEl, answerText, candidateImageUrls){
      const { text, images: imagesFromBlock } = parseAnswerAndImages(answerText);
      const candidates = Array.isArray(candidateImageUrls)
        ? candidateImageUrls.map(normalizeUrl).filter(isImageUrl)
        : [];
      const hasBlockImages = imagesFromBlock && imagesFromBlock.length > 0;

      const looseImages = extractUrlsLoose(answerText).map(normalizeUrl).filter(isImageUrl);

      const shouldShow = hasBlockImages || (candidates.length > 0) || (looseImages.length > 0);

      const allImages = new Set([
          ...(hasBlockImages ? imagesFromBlock : []),
          ...candidates,
          ...looseImages
      ]);
      const images = Array.from(allImages);

      containerEl.textContent = '';

      if((text || '').trim().length > 0){
        const textEl = document.createElement('div');
        textEl.className = 'answer-text';
        textEl.textContent = text;
        containerEl.appendChild(textEl);
      }else{
        const textEl = document.createElement('div');
        textEl.className = 'answer-text';
        textEl.textContent = '（已完成，但未返回答案）';
        containerEl.appendChild(textEl);
      }

      if(images && images.length > 0){
        const imgWrap = document.createElement('div');
        imgWrap.className = 'answer-images';
        for(const url of images){
          const safeUrl = normalizeUrl(url);
          const img = document.createElement('img');
          img.loading = 'lazy';
          img.src = safeUrl;
          img.alt = '参考图片';
          img.referrerPolicy = 'no-referrer';
          img.addEventListener('error', () => {
            img.style.display = 'none';
          });
          imgWrap.appendChild(img);

          const link = document.createElement('a');
          link.href = safeUrl;
          link.target = '_blank';
          link.rel = 'noopener noreferrer';
          link.textContent = url;
          imgWrap.appendChild(link);
        }
        containerEl.appendChild(imgWrap);
      }
    }

    function addUserMsg(text){
      const html = `
        <div class="msg user">
          <div>
            <div class="bubble">${escapeHtml(text)}</div>
            <div class="meta">${nowTime()}</div>
          </div>
          <div class="avatar">我</div>
        </div>
      `;
      chatEl.insertAdjacentHTML('beforeend', html);
      scrollToBottom();
    }

    function addUserMsgWithTime(text, ts){
      const html = `
        <div class="msg user">
          <div>
            <div class="bubble">${escapeHtml(text)}</div>
            <div class="meta">${formatTime(ts)}</div>
          </div>
          <div class="avatar">我</div>
        </div>
      `;
      chatEl.insertAdjacentHTML('beforeend', html);
      scrollToBottom();
    }

    function addBotMsgWithTime(text, ts, imageUrls){
      const id = 'bot-his-' + Math.random().toString(36).slice(2);
      const html = `
        <div class="msg bot" id="${id}">
          <div class="avatar bot">client</div>
          <div>
            <div class="bubble"><div class="answer"></div></div>
            <div class="meta">${formatTime(ts)}</div>
          </div>
        </div>
      `;
      chatEl.insertAdjacentHTML('beforeend', html);
      const el = document.getElementById(id);
      if(el){
        const answerEl = el.querySelector('.answer');
        renderAnswerWithImages(answerEl, text || '', imageUrls || []);
      }
      scrollToBottom();
    }

    function addBotMsgSkeleton(){
      const id = 'bot-' + Math.random().toString(36).slice(2);
      const html = `
        <div class="msg bot" id="${id}">
          <div class="avatar bot">client</div>
          <div style="min-width: 180px;">
            <div class="bubble">
              <span class="typing"><span class="dot"></span><span class="dot"></span><span class="dot"></span></span>
              <details class="progress" open>
                <summary>阶段进度（等待中）</summary>
                <ul></ul>
              </details>
            </div>
            <div class="meta">${nowTime()}</div>
          </div>
        </div>
      `;
      chatEl.insertAdjacentHTML('beforeend', html);
      scrollToBottom();
      return document.getElementById(id);
    }

    function renderProgress(botMsgEl, doneList, runningList, status){
      const details = botMsgEl.querySelector('details.progress');
      const summary = details.querySelector('summary');
      const ul = details.querySelector('ul');
      const done = Array.isArray(doneList) ? doneList : [];
      const running = Array.isArray(runningList) ? runningList : [];
      const totalDone = done.length;
      const totalRun = running.length;

      const statusMap = {
        'processing': '处理中',
        'completed': '已完成',
        'failed': '失败',
        'pending': '等待中',
      };
      const displayStatus = statusMap[status] || status || 'unknown';

      summary.textContent = `阶段进度（已完成${totalDone}，进行中${totalRun}，状态：${displayStatus}）`;

      const lines = [
        ...done.map(x => `✅ ${x}`),
        ...running.map(x => `⏳ ${x}`)
      ];
      ul.innerHTML = '';
      if(lines.length === 0){
        ul.insertAdjacentHTML('beforeend', '<li>暂无进度</li>');
      }else{
        for(const line of lines){
          ul.insertAdjacentHTML('beforeend', `<li>${escapeHtml(line)}</li>`);
        }
      }
    }

    function finalizeBotAnswer(botMsgEl, answer, error, imageUrls){
      const bubble = botMsgEl.querySelector('.bubble');
      const progress = botMsgEl.querySelector('details.progress');
      const err = (error || '').trim();

      if(err){
        const progressEl = progress ? progress : null;
        if(progressEl) {
            progressEl.remove();
            progressEl.removeAttribute('open');
        }
        bubble.textContent = '';
        const errEl = document.createElement('div');
        errEl.className = 'answer';
        errEl.textContent = `抱歉，本次处理失败：\n${err}`;
        bubble.appendChild(errEl);
        if(progressEl) bubble.appendChild(progressEl);
        return;
      }

      const progressEl = progress ? progress : null;
      if(progressEl) {
        progressEl.remove();
        progressEl.removeAttribute('open');
      }
      bubble.textContent = '';
      const answerEl = document.createElement('div');
      answerEl.className = 'answer';
      bubble.appendChild(answerEl);
      renderAnswerWithImages(answerEl, answer || '', imageUrls || []);
      if(progressEl) bubble.appendChild(progressEl);
    }

    async function loadHistory(){
      try{
        const res = await fetch(`${API_BASE}/history/${sessionId}`);
        if(!res.ok) return;
        const data = await res.json();
        const items = Array.isArray(data.items) ? data.items : [];
        if(items.length === 0) return;
        const nodes = Array.from(chatEl.querySelectorAll('.msg'));
        for(let i=1;i<nodes.length;i++) nodes[i].remove();
        for(const item of items){
          if(item.role === 'user'){
            addUserMsgWithTime(item.text || '', item.ts);
          }else{
            addBotMsgWithTime(item.text || '', item.ts, item.image_urls || []);
          }
        }
        scrollToBottom();
      }catch(_){}
    }

    async function submitQuery(text){
      const isStream = streamToggle.checked;
      const res = await fetch(`${API_BASE}/query`, {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({
          query: text,
          session_id: sessionId,
          is_stream: isStream
        })
      });
      if(!res.ok){
        const msg = await res.text();
        throw new Error(msg || '请求失败');
      }
      return await res.json();
    }

    async function poll(taskId, botMsgEl){
      const typing = botMsgEl.querySelector('.typing');
      const interval = setInterval(async () => {
        try{
          const res = await fetch(`${API_BASE}/status/${taskId}`);
          const data = await res.json();
          renderProgress(botMsgEl, data.done_list, data.running_list, data.status);

          if(data.status === 'completed'){
            if(typing) typing.remove();
            finalizeBotAnswer(botMsgEl, data.answer, data.error, data.image_urls || []);
            clearInterval(interval);
            sendBtn.disabled = false;
          }else if(data.status === 'failed'){
            if(typing) typing.remove();
            finalizeBotAnswer(botMsgEl, data.answer, data.error || 'failed', data.image_urls || []);
            clearInterval(interval);
            sendBtn.disabled = false;
          }
        }catch(e){
        }
      }, 1200);
    }

    async function onSend(){
      console.log('[perf] A onSend start', performance.now());
      const text = (inputEl.value || '').trim();
      if(!text) return;
      inputEl.value = '';
      addUserMsg(text);
      const botMsgEl = addBotMsgSkeleton();
      sendBtn.disabled = true;

      try{
        const isStream = streamToggle.checked;
        console.log('[perf] B submitQuery start', performance.now(), { isStream });
        const data = await submitQuery(text);
        console.log('[perf] B submitQuery end', performance.now(), data);

        renderProgress(botMsgEl, [], [], 'pending');

        if (!isStream) {
          renderProgress(botMsgEl, data.done_list || [], [], 'completed');
          finalizeBotAnswer(botMsgEl, data.answer, data.error, data.image_urls || []);

          if (data.options && data.options.length > 0) {
             const bubble = botMsgEl.querySelector('.bubble');
             renderClarifyOptions(bubble, data.options);
          }

          sendBtn.disabled = false;
          return;
        }

        const { task_id } = data;

        const bubble = botMsgEl.querySelector('.bubble');
        let answerEl = bubble.querySelector('.answer');
        if(!answerEl){
          answerEl = document.createElement('div');
          answerEl.className = 'answer';
          bubble.insertBefore(answerEl, bubble.firstChild);
        }

        const es = new EventSource(`${API_BASE}/stream/${task_id}`);
        console.log('[perf] C EventSource created', performance.now(), { task_id });
        let rawAnswerText = '';

        es.addEventListener('progress', (e) => {
          try{
            const d = JSON.parse(e.data || '{}');
            renderProgress(botMsgEl, d.done_list, d.running_list, d.status);
            if(d && d.status === 'completed'){
              const typing = botMsgEl.querySelector('.typing');
              if(typing) typing.remove();
              sendBtn.disabled = false;
            }
          }catch(_){}
        });

        es.addEventListener('delta', (e) => {
          try{
            const d = JSON.parse(e.data || '{}');
            const delta = d.delta || '';
            if(delta){
              rawAnswerText += delta;
              renderAnswerWithImages(answerEl, rawAnswerText, []);
              scrollToBottom();
            }
          }catch(_){}
        });

        function handleFinalEvent(e) {
          const typing = botMsgEl.querySelector('.typing');
          if(typing) typing.remove();

          const details = botMsgEl.querySelector('details.progress');
          if(details){
            const ul = details.querySelector('ul');
            if(ul){
              const lis = ul.querySelectorAll('li');
              lis.forEach(li => {
                if(li.textContent.includes('⏳')){
                  li.textContent = li.textContent.replace('⏳', '✅');
                }
              });
            }
            const summary = details.querySelector('summary');
            if(summary){
              const totalDone = details.querySelectorAll('li').length;
              summary.textContent = `阶段进度（已完成${totalDone}，进行中0，状态：已完成）`;
            }
            details.removeAttribute('open');
          }

          try{
            const d = JSON.parse(e.data || '{}');
            const finalText = (d && typeof d.answer === 'string' && d.answer.trim().length > 0) ? d.answer : (rawAnswerText || answerEl.textContent || '');
            renderAnswerWithImages(answerEl, finalText, d.image_urls || []);

            if (d.options && d.options.length > 0) {
              const bubble = botMsgEl.querySelector('.bubble');
              renderClarifyOptions(bubble, d.options);
            }
          }catch(_){}
          es.close();
          sendBtn.disabled = false;
        }

        es.addEventListener('final', handleFinalEvent);
        es.addEventListener('final_answer', handleFinalEvent);

        es.addEventListener('error', (e) => {
          const typing = botMsgEl.querySelector('.typing');
          if(typing) typing.remove();
          const progress = botMsgEl.querySelector('details.progress');
          if(progress) progress.removeAttribute('open');

          try{
            const msg = e && e.data ? (JSON.parse(e.data).error || 'SSE 连接中断/失败') : 'SSE 连接中断/失败';
            rawAnswerText += `\n\n（错误：${msg}）`;
            renderAnswerWithImages(answerEl, rawAnswerText, []);
          }catch(_){
            rawAnswerText += `\n\n（错误：SSE 连接中断/失败）`;
            renderAnswerWithImages(answerEl, rawAnswerText, []);
          }
          es.close();
          sendBtn.disabled = false;
        });
      }catch(e){
        const bubble = botMsgEl.querySelector('.bubble');
        const progress = botMsgEl.querySelector('details.progress');
        const typing = botMsgEl.querySelector('.typing');
        if(typing) typing.remove();
        bubble.innerHTML = `请求失败：${escapeHtml(e.message || e)}\n\n` + progress.outerHTML;
        sendBtn.disabled = false;
      }
    }

    sendBtn.addEventListener('click', onSend);
    inputEl.addEventListener('keydown', (e) => {
      if(e.key === 'Enter' && !e.shiftKey){
        e.preventDefault();
        onSend();
      }
    });
    btnClear.addEventListener('click', async () => {
      if(!confirm('确定要清空当前会话的历史记录吗？这将无法恢复。')) return;

      try {
        const res = await fetch(`${API_BASE}/history/${sessionId}`, { method: 'DELETE' });
        if(!res.ok) {
           console.error("Failed to clear history backend, status:", res.status);
           alert('服务端清空失败，仅清空本地显示');
        }
      } catch(e) {
        console.error("Failed to clear history backend", e);
        alert('服务端清空失败，仅清空本地显示');
      }

      const nodes = Array.from(chatEl.querySelectorAll('.msg'));
      for(let i=1;i<nodes.length;i++) nodes[i].remove();
      scrollToBottom();
    });

    loadHistory();
    setTimeout(() => inputEl.focus(), 200);
  </script>
</body>
</html>
